<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">源显月报工作流程</title>
  <desc id="desc">从每日工作记录，经去重核对，生成点线面月报</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#eefaf4"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" rx="24" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g transform="translate(40 45)">
      <rect width="250" height="170" rx="18" fill="#fff" stroke="#b9d4f5" stroke-width="2"/>
      <rect x="26" y="26" width="44" height="52" rx="6" fill="#2f81f7"/>
      <path d="M36 39h24M36 50h24M36 61h17" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="125" y="112" font-size="25" font-weight="700" fill="#17365d">工作日记</text>
      <text x="125" y="143" font-size="15" fill="#526b84">日期 · 来源 · 状态</text>
    </g>
    <path d="M315 130h45m-12-12 12 12-12 12" fill="none" stroke="#6f9dcc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(355 45)">
      <rect width="250" height="170" rx="18" fill="#fff" stroke="#b9d4f5" stroke-width="2"/>
      <circle cx="125" cy="52" r="25" fill="#e3f0ff"/>
      <path d="m111 52 10 10 19-21" fill="none" stroke="#2f81f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="125" y="112" font-size="25" font-weight="700" fill="#17365d">去重核对</text>
      <text x="125" y="143" font-size="15" fill="#526b84">关联计划 · 保留明细</text>
    </g>
    <path d="M630 130h45m-12-12 12 12-12 12" fill="none" stroke="#6f9dcc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(670 45)">
      <rect width="250" height="170" rx="18" fill="#fff" stroke="#a4ddbd" stroke-width="2"/>
      <rect x="93" y="28" width="64" height="48" rx="6" fill="#2da46a"/>
      <path d="M103 42h44M103 54h44M103 66h44M118 35v35M133 35v35" stroke="#fff" stroke-width="2"/>
      <text x="125" y="112" font-size="25" font-weight="700" fill="#176441">点线面月报</text>
      <text x="125" y="143" font-size="15" fill="#527963">Excel 草稿 · 人工定稿</text>
    </g>
  </g>
</svg>
